[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-compiler"
version = "0.1.0"
description = "A small quantum circuit optimization and routing package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
]

[project.scripts]
quantum-compiler = "quantum_compiler.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
